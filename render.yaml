databases:
  - name: bfc-lms-db
    databaseName: bfc_lms
    user: admin
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: lms
    runtime: node
    plan: free
    rootDir: bfc-lms

    buildCommand: >
      cd server &&
      npm ci --include=dev &&
      npm run build &&
      cd ../client &&
      npm ci --include=dev &&
      npm run build &&
      cd .. &&
      rm -rf database/node_modules &&
      ln -s ../server/node_modules database/node_modules

    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bfc-lms-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false
      - key: STORAGE_DIR
        value: /opt/render/project/src/bfc-lms/storage
