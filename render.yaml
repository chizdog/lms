# ============================================================
# But First, Coffee — LMS  ·  Render Blueprint
# ------------------------------------------------------------
# Deploy: push this repo to GitHub/GitLab, then in Render choose
# "New +" -> "Blueprint" and point it at the repo. Render reads
# this file from the repository root and creates both services.
#
# After the first deploy, open the web service's "Shell" tab and
# initialise the database ONCE:
#     cd server && npm run db:schema && npm run db:seed
# ============================================================

databases:
  - name: bfc-lms-db
    databaseName: bfc_lms
    user: bfc_app
    plan: free            # upgrade to a paid plan for production persistence/backups
    postgresMajorVersion: "16"



services:
  - type: web
    name: bfc-lms
    runtime: node
    plan: free
    rootDir: bfc-lms

    buildCommand: |
      npm --prefix server ci --include=dev &&
      npm --prefix server run build &&
      npm --prefix client ci --include=dev &&
      npm --prefix client run build &&
      rm -rf database/node_modules &&
      ln -s ../server/node_modules database/node_modules

    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bfc-lms-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false
      - key: STORAGE_DIR
        value: /opt/render/project/src/bfc-lms/storage

      # Render's managed Postgres presents a certificate that is not in the
      # default public CA bundle, so strict verification is disabled for this
      # managed connection. For strict verification instead, remove this and
      # set DB_SSL_CA to the provider's CA certificate (PEM).
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # Render terminates TLS, so the app sits behind HTTPS -> Secure cookies on.
      - key: COOKIE_SECURE
        value: "true"
      # Set this to the service's public URL after deploy, e.g.
      # https://bfc-lms.onrender.com  (comma-separate multiple origins).
      - key: CLIENT_ORIGIN
        sync: false
      # Ephemeral on the free tier. To persist uploads/certificates, attach a
      # Render Disk (paid) mounted at /var/data and set STORAGE_DIR=/var/data.
      - key: STORAGE_DIR
        value: /opt/render/project/src/bfc-lms/storage
    # Uncomment to persist uploaded files & certificates across deploys
    # (requires a paid instance plan):
    # disk:
    #   name: bfc-lms-storage
    #   mountPath: /var/data
    #   sizeGB: 1